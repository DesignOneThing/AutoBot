[project]
name = "avtonet-telegram-bot"
version = "0.1.0"
description = "Telegram bot that monitors avto.net searches and reports new car listings."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anyio>=4.5,<5",
    "beautifulsoup4>=4.12.3,<5",
    "httpx>=0.27.0,<0.29",
    "idna>=3.7,<4",
    "python-dotenv>=1.0.1,<2",
    "python-telegram-bot>=21.6,<23",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
]

[project.scripts]
avtonet-bot = "avtonet_bot.__main__:main"

[tool.poetry]
packages = [
    { include = "avtonet_bot", from = "src" },
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
